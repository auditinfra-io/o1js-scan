name: 'o1js-scan'
description: 'Static soundness scanner for o1js / Mina zkApps and Noir circuits. Surfaces findings in GitHub code scanning.'
author: 'auditinfra-io'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'File or directory to scan.'
    required: false
    default: '.'
  lang:
    description: 'Which sources to analyze: auto (both), o1js, or noir.'
    required: false
    default: 'auto'
  version:
    description: 'o1js-scan version to install from PyPI (empty = latest).'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload the SARIF report to GitHub code scanning (requires security-events: write).'
    required: false
    default: 'true'
  fail-on:
    description: 'Minimum finding severity that fails the job: critical, high, medium, low, or none.'
    required: false
    default: 'none'
  fail-on-findings:
    description: 'DEPRECATED — use fail-on instead. When true and fail-on is none, behaves as fail-on: high.'
    required: false
    default: 'false'
  include-tests:
    description: 'Also report findings in test code (*.test.ts, *_test.nr, test/ and tests/ directories, Noir #[test] and mod test). Excluded by default.'
    required: false
    default: 'false'
  include-examples:
    description: 'Keep the original severity for findings in example code (examples/ directories, .eg. filenames). Downgraded to LOW by default.'
    required: false
    default: 'false'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file.'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install o1js-scan
      shell: bash
      # Inputs reach the script through the environment, never through
      # ${{ }} interpolation into the script body: a composite action
      # interpolates before bash parses, so an input containing shell
      # metacharacters would execute in this step.
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          python -m pip install "o1js-scan==$VERSION"
        else
          python -m pip install o1js-scan
        fi

    - name: Run o1js-scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        LANG_INPUT: ${{ inputs.lang }}
        INCLUDE_TESTS: ${{ inputs.include-tests }}
        INCLUDE_EXAMPLES: ${{ inputs.include-examples }}
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        set -euo pipefail

        # One argument array drives both passes, so the report and the gate can
        # never analyze different effective inputs.
        ARGS=("$SCAN_PATH" --lang "$LANG_INPUT")
        if [ "$INCLUDE_TESTS" = "true" ]; then ARGS+=(--include-tests); fi
        if [ "$INCLUDE_EXAMPLES" = "true" ]; then ARGS+=(--include-examples); fi

        # Reporting pass: --fail-on none means findings do not fail this step,
        # so the SARIF upload always has a file to consume. Operational
        # failures (bad path, CLI usage error, crash) still fail the step --
        # a blanket `|| true` here would turn a broken scan into a clean one.
        o1js-scan "${ARGS[@]}" --fail-on none --sarif o1js-scan.sarif
        echo "sarif-file=o1js-scan.sarif" >> "$GITHUB_OUTPUT"

        # Resolve the gate: fail-on wins; the deprecated boolean maps to high.
        GATE="$FAIL_ON"
        if [ "$GATE" = "none" ] && [ "$FAIL_ON_FINDINGS" = "true" ]; then
          GATE="high"
          echo "::warning::fail-on-findings is deprecated; use fail-on: high"
        fi
        echo "gate=$GATE" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: o1js-scan.sarif
        category: o1js-scan

    - name: Enforce finding gate
      if: ${{ steps.scan.outputs.gate != 'none' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        LANG_INPUT: ${{ inputs.lang }}
        INCLUDE_TESTS: ${{ inputs.include-tests }}
        INCLUDE_EXAMPLES: ${{ inputs.include-examples }}
        GATE: ${{ steps.scan.outputs.gate }}
      run: |
        set -euo pipefail
        ARGS=("$SCAN_PATH" --lang "$LANG_INPUT")
        if [ "$INCLUDE_TESTS" = "true" ]; then ARGS+=(--include-tests); fi
        if [ "$INCLUDE_EXAMPLES" = "true" ]; then ARGS+=(--include-examples); fi
        o1js-scan "${ARGS[@]}" --fail-on "$GATE"
