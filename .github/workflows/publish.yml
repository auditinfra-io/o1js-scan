name: Publish

# Publishes the package to PyPI *and* npm when a GitHub Release is published.
# Cut a release (which creates the matching `vX.Y.Z` tag) and this builds an
# sdist + wheel and uploads them, then publishes the npm wrapper.
#
# Auth (PyPI): uses the PYPI_API_TOKEN repository secret. To switch to PyPI
# Trusted Publishing (recommended — no long-lived token), configure a trusted
# publisher for this repo/workflow on PyPI, delete the `password:` line below,
# and keep `id-token: write`; the publish action will use OIDC automatically.
#
# Auth (npm): uses the NPM_TOKEN repository secret — an npm *automation* token
# (Access Tokens -> Generate -> Automation), which bypasses 2FA for CI.
#
# Why npm is here at all: README tells Node users to `npm install -D o1js-scan`,
# CI has smoke-tested `bin/o1js-scan.js` on every run since it was added, and
# the package had still never been published — the registry returned 404 for
# the name. The wrapper was built, tested and documented but never shipped.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Runs before either upload. A release cut without bumping the manifests is
  # the failure mode this exists for: cutting a tag does NOT change
  # pyproject.toml / __init__.py / package.json, so v0.11.0 was published from
  # a tree that still said 0.10.0. npm caught it on its own gate; PyPI only
  # failed downstream, as "file already exists" for the real 0.10.0 — a
  # confusing symptom several steps from the cause. Both jobs now share one
  # check that names the actual problem.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests agree with each other
        run: python3 scripts/bump_version.py --check

      - name: Manifests agree with the release tag
        run: |
          set -euo pipefail
          version="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          echo "manifests=${version}  tag=${tag}  ref_type=${GITHUB_REF_TYPE}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::notice::manual dispatch — skipping the tag comparison"
            exit 0
          fi
          if [ "${version}" != "${tag}" ]; then
            echo "::error::Release tag v${tag} but the manifests say ${version}."
            echo "::error::Cutting a tag does not bump the version. Run:"
            echo "::error::  python3 scripts/bump_version.py ${tag}"
            echo "::error::then commit, delete tag v${tag}, and re-cut the release."
            exit 1
          fi

  build-and-publish:
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      id-token: write        # for PyPI Trusted Publishing (OIDC), if enabled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Makes re-running a release idempotent. If npm failed and PyPI
          # succeeded, the retry must not die on "file already exists" for the
          # version it just uploaded. Safe because `preflight` has already
          # proven the manifests match the tag, so a skipped file is genuinely
          # the same version and not a silently wrong one.
          skip-existing: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      id-token: write        # required by `npm publish --provenance`
    # Independent of build-and-publish (not `needs:`) so an upload failure at
    # one registry still lets the other report its own outcome. Both share
    # `preflight`, because a version mismatch is never safe for either.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        # `setup-python` gives a bare interpreter — pytest is NOT preinstalled,
        # and tests/test_packaging.py imports o1js_scan. Without this the step
        # below dies instantly with "No module named pytest", which is exactly
        # what happened on the first release that got this far (2026-07-29).
        run: pip install -e ".[dev]"

      - name: Packaging tests
        # The manifest-shape assertions (files globs, optional peer dep,
        # declared bins) that `preflight` does not cover.
        run: python -m pytest tests/test_packaging.py -q

      - name: Smoke-test the packed tarball
        # Install the ACTUAL artifact and run it, rather than trusting that the
        # repo working tree would have worked. Catches a bad `files` glob.
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp/pkg
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install /tmp/pkg/*.tgz
          ./node_modules/.bin/o1js-scan --version
          ./node_modules/.bin/noir-scan --help >/dev/null

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
