name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published.
# Cut a release (which creates the matching `vX.Y.Z` tag) and this builds an
# sdist + wheel and uploads them.
#
# Auth: uses the PYPI_API_TOKEN repository secret. To switch to PyPI Trusted
# Publishing (recommended — no long-lived token), configure a trusted publisher
# for this repo/workflow on PyPI, delete the `password:` line below, and keep
# `id-token: write`; the publish action will use OIDC automatically.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # for PyPI Trusted Publishing (OIDC), if enabled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
